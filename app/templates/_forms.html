{% macro schedule_fields(zones, zone, days, start, end) %}
  <label>Часовой пояс
    <select name="timezone">
      {% for name, label in zones.items() %}<option value="{{ name }}"{% if name == zone %} selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </label>
  <p>Рабочие дни:
    {% for name in day_names %}<label class="inline"><input type="checkbox" name="days" value="{{ loop.index }}"{% if loop.index in days %} checked{% endif %}> {{ name }}</label>{% endfor %}
  </p>
  <label>Рабочее время с <input name="work_start" value="{{ start }}" size="5" required pattern="[0-2]?[0-9]:[0-5][0-9]"> до <input name="work_end" value="{{ end }}" size="5" required pattern="[0-2]?[0-9]:[0-5][0-9]"></label>
{% endmacro %}
