{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block public %}
<div class="login">
  <form method="post" action="/login" class="card">
    <div class="person"><img class="avatar-img" src="/static/avatar.png" alt="" width="64" height="64"><div><h1 class="title">Кабинет HR</h1><p class="muted">Корсик, помощник новичков</p></div></div>
    {% if error %}<div class="notice bad">{{ error }}</div>{% endif %}
    <label class="field"><span>Пароль</span><input type="password" name="password" autofocus required></label>
    <button class="btn wide">Войти</button>
  </form>
</div>
{% endblock %}
